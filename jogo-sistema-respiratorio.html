<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Atlas do Sistema Respiratório</title>
<style>
  :root {
    --paper: #f3eedf;
    --paper-2: #eae1c8;
    --paper-3: #e2d7ba;
    --ink: #26313f;
    --ink-soft: #5b6472;
    --rule: #c9bea0;
    --skin: #e7cca9;
    --skin-line: #b98f5f;
    --accent: #8e3b2e;
    --accent-soft: #b96f5c;
    --success: #3f6b52;
    --success-soft: #dce8de;
    --success-ink: #1f3b2c;
    --organ-cavity: #d98770;
    --organ-cartilage: #c9b48a;
    --organ-lung: #d99a8c;
    --organ-lung-line: #a15a4d;
    --organ-alveoli: #8e3b2e;
    --shadow: 0 10px 30px -14px rgba(38, 49, 63, 0.35);
    --backdrop: rgba(20, 16, 8, 0.5);
  }

  @media (prefers-color-scheme: dark) {
    :root {
      --paper: #12161c; --paper-2: #1a212a; --paper-3: #212a35;
      --ink: #e8e2ce; --ink-soft: #a3aab3; --rule: #38414d;
      --skin: #6b5236; --skin-line: #a9855a;
      --accent: #d98a72; --accent-soft: #a45c48;
      --success: #7fb595; --success-soft: #223129; --success-ink: #cdead9;
      --organ-alveoli: #d98a72;
      --shadow: 0 10px 34px -12px rgba(0, 0, 0, 0.55);
      --backdrop: rgba(0, 0, 0, 0.6);
    }
  }
  :root[data-theme="dark"] {
    --paper: #12161c; --paper-2: #1a212a; --paper-3: #212a35;
    --ink: #e8e2ce; --ink-soft: #a3aab3; --rule: #38414d;
    --skin: #6b5236; --skin-line: #a9855a;
    --accent: #d98a72; --accent-soft: #a45c48;
    --success: #7fb595; --success-soft: #223129; --success-ink: #cdead9;
    --organ-alveoli: #d98a72;
    --shadow: 0 10px 34px -12px rgba(0, 0, 0, 0.55);
    --backdrop: rgba(0, 0, 0, 0.6);
  }
  :root[data-theme="light"] {
    --paper: #f3eedf; --paper-2: #eae1c8; --paper-3: #e2d7ba;
    --ink: #26313f; --ink-soft: #5b6472; --rule: #c9bea0;
    --skin: #e7cca9; --skin-line: #b98f5f;
    --accent: #8e3b2e; --accent-soft: #b96f5c;
    --success: #3f6b52; --success-soft: #dce8de; --success-ink: #1f3b2c;
    --organ-alveoli: #8e3b2e;
    --shadow: 0 10px 30px -14px rgba(38, 49, 63, 0.35);
    --backdrop: rgba(20, 16, 8, 0.5);
  }

  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    background: var(--paper);
    color: var(--ink);
    font-family: -apple-system, "Segoe UI", "Helvetica Neue", Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
    overflow: hidden;
  }

  .app { display: flex; flex-direction: column; height: 100vh; height: 100dvh; max-width: 1180px; margin: 0 auto; }

  .app-header { flex: 0 0 auto; padding: 12px 16px 0; border-bottom: 1px solid var(--rule); }
  .eyebrow {
    font-family: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace;
    font-size: 10.5px; letter-spacing: 0.13em; text-transform: uppercase;
    color: var(--accent); margin: 0 0 3px;
  }
  h1 {
    font-family: Georgia, "Iowan Old Style", Palatino, "Palatino Linotype", serif;
    font-weight: 700; font-size: clamp(18px, 4.6vw, 26px); line-height: 1.12;
    margin: 0 0 8px; text-wrap: balance;
  }

  .tabbar { display: flex; gap: 4px; padding-bottom: 8px; }
  .tab {
    flex: 1 1 0;
    font-family: "SFMono-Regular", Consolas, monospace;
    font-size: 11.5px;
    letter-spacing: 0.02em;
    text-align: center;
    padding: 8px 4px;
    background: transparent;
    border: 1px solid var(--rule);
    border-radius: 4px 4px 0 0;
    color: var(--ink-soft);
    cursor: pointer;
  }
  .tab.active { background: var(--paper-2); color: var(--accent); border-bottom-color: var(--paper-2); font-weight: 700; }

  .app-body { flex: 1 1 auto; min-height: 0; display: flex; position: relative; }
  @media (min-width: 860px) { .app-body { padding: 16px; gap: 20px; } }

  .stage { flex: 1 1 auto; min-width: 0; min-height: 0; display: flex; align-items: center; justify-content: center; padding: 10px 14px; }
  .view { width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; }
  .view[hidden] { display: none; }

  /* ---- atlas view ---- */
  .stage-inner { display: flex; flex-direction: column; align-items: center; gap: 4px; height: 100%; max-height: 100%; }
  .plate-frame {
    position: relative; background: var(--paper); border: 1px solid var(--rule); box-shadow: var(--shadow);
    max-width: 100%; max-height: calc(100% - 16px); aspect-ratio: 1100 / 1157; flex: 1 1 auto; min-height: 0;
  }
  .plate-frame svg { display: block; width: 100%; height: 100%; }
  .plate-caption { flex: 0 0 auto; font-family: "SFMono-Regular", Consolas, monospace; font-size: 10.5px; color: var(--ink-soft); white-space: nowrap; }

  .pin { cursor: pointer; touch-action: manipulation; }
  .pin .pin-hit { fill: transparent; pointer-events: all; }
  .pin .pin-circle { transition: fill 0.15s ease, stroke 0.15s ease; }
  .pin:hover .pin-circle, .pin:focus-visible .pin-circle { stroke-width: 2.5; }
  .pin:focus-visible { outline: none; }
  .pin:focus-visible .pin-circle { filter: drop-shadow(0 0 0 2px var(--accent)); }
  .pin.solved { cursor: default; }
  .pin.open .pin-circle { fill: var(--paper-3); }

  /* ---- legend panel (atlas review drawer) ---- */
  .legend-panel { position: fixed; inset: 0; z-index: 40; display: flex; justify-content: flex-end; visibility: hidden; }
  .legend-panel.open { visibility: visible; }
  .legend-panel-backdrop { position: absolute; inset: 0; background: var(--backdrop); opacity: 0; }
  .legend-panel.open .legend-panel-backdrop { opacity: 1; }
  @media (prefers-reduced-motion: no-preference) { .legend-panel-backdrop { transition: opacity 0.2s ease; } }
  .legend-panel-card {
    position: relative; width: min(340px, 86vw); height: 100%; background: var(--paper-2);
    border-left: 1px solid var(--rule); box-shadow: var(--shadow);
    display: flex; flex-direction: column; transform: translateX(100%);
  }
  .legend-panel.open .legend-panel-card { transform: translateX(0); }
  @media (prefers-reduced-motion: no-preference) { .legend-panel-card { transition: transform 0.22s ease; } }
  .legend-head { flex: 0 0 auto; display: flex; align-items: baseline; justify-content: space-between; gap: 12px; padding: 16px 18px 12px; border-bottom: 1px solid var(--rule); }
  .legend-head h2 { font-family: Georgia, "Iowan Old Style", Palatino, serif; font-size: 18px; margin: 0; }
  .legend-panel-close { background: none; border: none; color: var(--ink-soft); font-size: 20px; line-height: 1; cursor: pointer; padding: 2px 6px; }
  .legend-panel-close:hover { color: var(--accent); }
  .legend-list { flex: 1 1 auto; overflow-y: auto; display: flex; flex-direction: column; gap: 6px; padding: 12px 18px 18px; }
  .row { display: grid; grid-template-columns: 24px 1fr; align-items: center; gap: 10px; padding: 2px 0; border-bottom: 1px solid var(--rule); }
  .row-num { font-family: Georgia, serif; font-weight: 700; font-size: 13.5px; color: var(--accent); text-align: center; }
  .slot {
    width: 100%; text-align: left; min-height: 42px; border: 1.5px dashed var(--rule); border-radius: 3px; background: transparent;
    display: flex; align-items: center; gap: 8px; padding: 0 11px; font: inherit; font-size: 13.5px; color: var(--ink-soft);
    cursor: pointer; transition: border-color 0.15s ease, background 0.15s ease;
  }
  .slot:hover, .slot:focus-visible { border-color: var(--accent-soft); background: var(--paper-3); }
  .slot:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .slot.solved { border-style: solid; border-color: var(--success); background: var(--success-soft); color: var(--success-ink); font-weight: 600; cursor: default; }
  .slot .check { flex: 0 0 auto; width: 15px; height: 15px; border-radius: 50%; background: var(--success); color: var(--paper); font-size: 10px; display: flex; align-items: center; justify-content: center; }

  @media (min-width: 860px) {
    .legend-panel { position: static; visibility: visible; display: block; width: 300px; flex: 0 0 auto; }
    .legend-panel-backdrop { display: none; }
    .legend-panel-card { transform: none; border: 1px solid var(--rule); border-radius: 4px; width: 100%; }
    .legend-panel-close { display: none; }
  }

  /* ---- sequence view ---- */
  .seq-wrap { width: 100%; max-width: 460px; height: 100%; display: flex; flex-direction: column; gap: 8px; padding: 4px 0; }
  .view-hint { margin: 0; font-size: 12.5px; color: var(--ink-soft); line-height: 1.4; flex: 0 0 auto; }
  .seq-slots { flex: 0 1 auto; display: grid; grid-template-columns: 1fr 1fr; gap: 5px 10px; overflow-y: auto; }
  .seq-slot {
    display: flex; align-items: center; gap: 6px; min-height: 34px;
    border: 1.5px dashed var(--rule); border-radius: 3px; padding: 0 8px;
    font-size: 12.5px; color: var(--ink-soft); background: transparent; cursor: default;
    width: 100%; text-align: left; font-family: inherit;
  }
  .seq-slot .ord { font-family: Georgia, serif; font-weight: 700; color: var(--accent); font-size: 12px; flex: 0 0 auto; }
  .seq-slot.filled { cursor: pointer; border-style: solid; color: var(--ink); }
  .seq-slot.correct { border-color: var(--success); background: var(--success-soft); color: var(--success-ink); font-weight: 600; cursor: default; }
  .seq-slot.wrong { border-color: var(--accent); background: color-mix(in srgb, var(--accent) 12%, var(--paper)); }
  @media (prefers-reduced-motion: no-preference) { .seq-slot.wrong { animation: shake 0.32s ease; } }

  .seq-bank { flex: 0 0 auto; display: flex; flex-wrap: wrap; gap: 6px; padding-top: 4px; border-top: 1px dashed var(--rule); min-height: 40px; }
  .chip {
    font-family: "SFMono-Regular", Consolas, monospace; font-size: 12.5px; color: var(--ink);
    background: var(--paper); border: 1px solid var(--skin-line); border-left: 3px solid var(--accent);
    border-radius: 2px; padding: 7px 10px; cursor: pointer; touch-action: manipulation;
  }
  .chip:hover { background: var(--paper-3); }

  .primary-btn {
    flex: 0 0 auto; font-family: "SFMono-Regular", Consolas, monospace; font-size: 12.5px; letter-spacing: 0.04em; text-transform: uppercase;
    color: var(--paper); background: var(--accent); border: 1px solid var(--accent); border-radius: 4px; padding: 10px 14px; cursor: pointer;
    margin-top: 4px;
  }
  .primary-btn:disabled { opacity: 0.4; cursor: default; }

  /* ---- function view ---- */
  .func-wrap { width: 100%; max-width: 460px; height: 100%; display: flex; flex-direction: column; gap: 10px; padding: 4px 0; justify-content: center; }
  .func-progress-row { font-family: "SFMono-Regular", Consolas, monospace; font-size: 11.5px; color: var(--ink-soft); flex: 0 0 auto; }
  .func-card {
    flex: 0 0 auto; background: var(--paper-2); border: 1px solid var(--rule); border-radius: 6px;
    padding: 18px 18px; box-shadow: var(--shadow); font-family: Georgia, "Iowan Old Style", Palatino, serif;
    font-size: clamp(15px, 4vw, 18px); line-height: 1.4; color: var(--ink); text-wrap: balance;
  }
  .func-options { flex: 0 0 auto; display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .option {
    width: 100%; text-align: left; font: inherit; font-size: 13px; color: var(--ink);
    background: var(--paper); border: 1px solid var(--rule); border-radius: 4px; padding: 11px 10px; cursor: pointer; touch-action: manipulation;
  }
  .option:hover, .option:focus-visible { border-color: var(--accent-soft); background: var(--paper-3); }
  .option.wrong { border-color: var(--accent); background: color-mix(in srgb, var(--accent) 14%, var(--paper)); }
  .option.correct { border-color: var(--success); background: var(--success-soft); color: var(--success-ink); }
  @media (prefers-reduced-motion: no-preference) { .option.wrong { animation: shake 0.32s ease; } }

  @keyframes shake { 0%, 100% { transform: translateX(0); } 25% { transform: translateX(-4px); } 75% { transform: translateX(4px); } }

  /* ---- footer ---- */
  .app-footer { flex: 0 0 auto; display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 8px 16px; border-top: 1px solid var(--rule); background: var(--paper-2); }
  .footer-progress { font-family: "SFMono-Regular", Consolas, monospace; font-size: 12px; color: var(--ink-soft); font-variant-numeric: tabular-nums; }
  .footer-progress b { color: var(--accent); }
  .footer-actions { display: flex; gap: 8px; }
  button.ghost-btn {
    font-family: "SFMono-Regular", Consolas, monospace; font-size: 11.5px; letter-spacing: 0.04em; text-transform: uppercase;
    color: var(--ink-soft); background: transparent; border: 1px solid var(--rule); border-radius: 3px; padding: 7px 11px; cursor: pointer;
  }
  button.ghost-btn:hover { border-color: var(--accent); color: var(--accent); }
  @media (min-width: 860px) { .legend-toggle { display: none; } }

  /* ---- choice sheet (atlas) ---- */
  .sheet-backdrop { position: fixed; inset: 0; background: var(--backdrop); display: none; align-items: flex-end; justify-content: center; z-index: 50; }
  .sheet-backdrop.show { display: flex; }
  .sheet {
    background: var(--paper-2); border: 1px solid var(--rule); border-bottom: none; border-radius: 10px 10px 0 0;
    width: 100%; max-width: 480px; max-height: 78vh; display: flex; flex-direction: column;
    box-shadow: 0 -12px 34px -10px rgba(0,0,0,0.4); transform: translateY(100%);
  }
  .sheet-backdrop.show .sheet { transform: translateY(0); }
  @media (prefers-reduced-motion: no-preference) { .sheet { transition: transform 0.24s cubic-bezier(.2,.8,.3,1); } }
  @media (min-width: 640px) { .sheet-backdrop { align-items: center; } .sheet { border-radius: 8px; border-bottom: 1px solid var(--rule); max-height: 70vh; } }
  .sheet-handle { width: 36px; height: 4px; background: var(--rule); border-radius: 2px; margin: 10px auto 2px; }
  @media (min-width: 640px) { .sheet-handle { display: none; } }
  .sheet-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 10px 20px 12px; border-bottom: 1px solid var(--rule); }
  .sheet-head h3 { font-family: Georgia, "Iowan Old Style", Palatino, serif; font-size: 17px; margin: 0; }
  .sheet-close { background: none; border: none; color: var(--ink-soft); font-size: 20px; line-height: 1; cursor: pointer; padding: 4px 6px; }
  .sheet-close:hover { color: var(--accent); }
  .sheet-list { overflow-y: auto; padding: 10px 14px 20px; display: flex; flex-direction: column; gap: 8px; }
  .sheet-list .option { padding: 13px 14px; font-size: 15px; }

  /* ---- completion overlay ---- */
  .complete-overlay { position: fixed; inset: 0; z-index: 60; display: none; align-items: center; justify-content: center; background: var(--backdrop); padding: 20px; }
  .complete-overlay.show { display: flex; }
  .complete-card {
    background: var(--paper-2); border: 1px solid var(--success); border-radius: 6px; box-shadow: var(--shadow);
    max-width: 360px; width: 100%; padding: 24px 22px; display: flex; flex-direction: column; align-items: center; text-align: center; gap: 12px;
  }
  .stamp {
    width: 68px; height: 68px; border-radius: 50%; border: 2.5px solid var(--success); color: var(--success);
    display: flex; align-items: center; justify-content: center; font-family: Georgia, serif; font-weight: 700; font-size: 11px;
    text-align: center; line-height: 1.15; transform: rotate(-9deg);
  }
  @media (prefers-reduced-motion: no-preference) { .complete-overlay.show .stamp { animation: stampIn 0.4s cubic-bezier(.2,.8,.3,1.4); } }
  @keyframes stampIn { from { transform: rotate(-9deg) scale(2); opacity: 0; } to { transform: rotate(-9deg) scale(1); opacity: 1; } }
  .complete-card p { margin: 0; font-size: 14.5px; line-height: 1.5; color: var(--ink); }
  .complete-card strong { font-family: Georgia, serif; font-size: 18px; }
  .complete-card button { margin-top: 6px; }
</style>

  <header class="app-header">
    <p class="eyebrow">Ciências · Sistema respiratório</p>
    <h1>Atlas do Sistema Respiratório</h1>
    <div class="tabbar" id="tabbar">
      <button class="tab active" type="button" data-view="atlas">Atlas</button>
      <button class="tab" type="button" data-view="sequence">Trajeto do ar</button>
      <button class="tab" type="button" data-view="function">Funções</button>
    </div>
  </header>

  <div class="app-body">
    <main class="stage">

                  <circle class="pin-circle" cx="50" cy="248" r="15" fill="var(--paper)" stroke="var(--accent)" stroke-width="1.5"/>
                  <text class="pin-text" x="50" y="253" text-anchor="middle" fill="var(--accent)">1</text>
                </g>
                <g class="pin" data-id="2" tabindex="0" role="button" aria-label="Estrutura 2">
                  <circle class="pin-hit" cx="1050" cy="195" r="26"/>
                  <circle class="pin-circle" cx="1050" cy="195" r="15" fill="var(--paper)" stroke="var(--accent)" stroke-width="1.5"/>
                  <text class="pin-text" x="1050" y="200" text-anchor="middle" fill="var(--accent)">2</text>
                </g>
                <g class="pin" data-id="3" tabindex="0" role="button" aria-label="Estrutura 3">
                  <circle class="pin-hit" cx="50" cy="325" r="26"/>
                  <circle class="pin-circle" cx="50" cy="325" r="15" fill="var(--paper)" stroke="var(--accent)" stroke-width="1.5"/>
                  <text class="pin-text" x="50" y="330" text-anchor="middle" fill="var(--accent)">3</text>
                </g>
                <g class="pin" data-id="4" tabindex="0" role="button" aria-label="Estrutura 4">
                  <circle class="pin-hit" cx="1050" cy="398" r="26"/>
                  <circle class="pin-circle" cx="1050" cy="398" r="15" fill="var(--paper)" stroke="var(--accent)" stroke-width="1.5"/>
                  <text class="pin-text" x="1050" y="403" text-anchor="middle" fill="var(--accent)">4</text>
                </g>
                <g class="pin" data-id="5" tabindex="0" role="button" aria-label="Estrutura 5">
                  <circle class="pin-hit" cx="50" cy="500" r="26"/>
                  <circle class="pin-circle" cx="50" cy="500" r="15" fill="var(--paper)" stroke="var(--accent)" stroke-width="1.5"/>
                  <text class="pin-text" x="50" y="505" text-anchor="middle" fill="var(--accent)">5</text>
                </g>
                <g class="pin" data-id="6" tabindex="0" role="button" aria-label="Estrutura 6">
                  <circle class="pin-hit" cx="1050" cy="600" r="26"/>
                  <circle class="pin-circle" cx="1050" cy="600" r="15" fill="var(--paper)" stroke="var(--accent)" stroke-width="1.5"/>
                  <text class="pin-text" x="1050" y="605" text-anchor="middle" fill="var(--accent)">6</text>
                </g>
                <g class="pin" data-id="7" tabindex="0" role="button" aria-label="Estrutura 7">
                  <circle class="pin-hit" cx="50" cy="650" r="26"/>
                  <circle class="pin-circle" cx="50" cy="650" r="15" fill="var(--paper)" stroke="var(--accent)" stroke-width="1.5"/>
                  <text class="pin-text" x="50" y="655" text-anchor="middle" fill="var(--accent)">7</text>
                </g>
                <g class="pin" data-id="8" tabindex="0" role="button" aria-label="Estrutura 8">
                  <circle class="pin-hit" cx="1050" cy="660" r="26"/>
                  <circle class="pin-circle" cx="1050" cy="660" r="15" fill="var(--paper)" stroke="var(--accent)" stroke-width="1.5"/>
                  <text class="pin-text" x="1050" y="665" text-anchor="middle" fill="var(--accent)">8</text>
                </g>
                <g class="pin" data-id="9" tabindex="0" role="button" aria-label="Estrutura 9">
                  <circle class="pin-hit" cx="50" cy="730" r="26"/>
                  <circle class="pin-circle" cx="50" cy="730" r="15" fill="var(--paper)" stroke="var(--accent)" stroke-width="1.5"/>
                  <text class="pin-text" x="50" y="735" text-anchor="middle" fill="var(--accent)">9</text>
                </g>
              </g>
            </svg>
          </div>
          <div class="plate-caption">Imagem do livro — sistema respiratório</div>
        </div>
      </section>

      <!-- SEQUENCE VIEW -->
      <section class="view" id="view-sequence" hidden>
        <div class="seq-wrap">
          <p class="view-hint">Toque nos termos, na ordem em que o ar passa por eles, do nariz até o sangue.</p>
          <div class="seq-slots" id="seq-slots"></div>
          <div class="seq-bank" id="seq-bank"></div>
          <button class="primary-btn" id="seq-check" disabled type="button">Conferir</button>
        </div>
      </section>

      <!-- FUNCTION VIEW -->
      <section class="view" id="view-function" hidden>
        <div class="func-wrap">
          <p class="func-progress-row" id="func-progress-label">Pergunta 1 de 8</p>
          <div class="func-card" id="func-clue">—</div>
          <div class="func-options" id="func-options"></div>
        </div>
      </section>
    </main>

    <div class="legend-panel" id="legend-panel">
      <div class="legend-panel-backdrop" id="legend-panel-backdrop"></div>
      <div class="legend-panel-card">
        <div class="legend-head">
          <h2>Legenda</h2>
          <button class="legend-panel-close" id="legend-panel-close" type="button" aria-label="Fechar legenda">&times;</button>
        </div>
        <div class="legend-list" id="legend-list"></div>
      </div>
    </div>
  </div>

  <footer class="app-footer">
    <span class="footer-progress" id="footer-progress"><b id="progress-count">0</b> / 9 identificados</span>
    <div class="footer-actions">
      <button class="ghost-btn legend-toggle" id="legend-toggle" type="button">Legenda</button>
      <button class="ghost-btn" id="reset-btn" type="button">Reiniciar</button>
    </div>
  </footer>
</div>

<div class="sheet-backdrop" id="sheet-backdrop">
  <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="sheet-title">
    <div class="sheet-handle"></div>
    <div class="sheet-head">
      <h3 id="sheet-title">Estrutura nº —</h3>
      <button class="sheet-close" id="sheet-close" type="button" aria-label="Fechar">&times;</button>
    </div>
    <div class="sheet-list" id="sheet-list"></div>
  </div>
</div>

<div class="complete-overlay" id="complete-overlay">
  <div class="complete-card">
    <div class="stamp" id="complete-stamp">MUITO<br/>BEM</div>
    <p><strong>Muito bem!</strong></p>
    <p id="complete-msg">Você completou este modo.</p>
    <button class="ghost-btn" id="complete-reset-btn" type="button">Jogar de novo</button>
  </div>
</div>

<script>
(function () {
  // ---- shared data ----
  var atlasTerms = [
    { id: 1, label: "Nariz" },
    { id: 2, label: "Cavidade nasal" },
    { id: 3, label: "Faringe" },
    { id: 4, label: "Laringe" },
    { id: 5, label: "Traqueia" },
    { id: 6, label: "Brônquios" },
    { id: 7, label: "Pulmão direito" },
    { id: 8, label: "Pulmão esquerdo" },
    { id: 9, label: "Alvéolos" }
  ];
  var atlasById = {};
  atlasTerms.forEach(function (t) { atlasById[t.id] = t; });

  var pathSteps = ["Nariz", "Cavidades nasais", "Faringe", "Laringe", "Traqueia", "Brônquios", "Pulmões", "Alvéolos"];

  var functionCards = [
    { clue: "Tem pelos que filtram parte da poeira do ar que entra por ele.", answer: "Nariz" },
    { clue: "Aqui o ar é aquecido e umedecido antes de continuar o caminho.", answer: "Cavidades nasais" },
    { clue: "Fica logo depois do nariz; por ela passam o ar e também o alimento.", answer: "Faringe" },
    { clue: "Fica entre a faringe e a traqueia, no pescoço.", answer: "Laringe" },
    { clue: "Se divide em dois ramos, chamados brônquios.", answer: "Traqueia" },
    { clue: "Levam o ar da traqueia para dentro de cada pulmão.", answer: "Brônquios" },
    { clue: "Dentro deles, os brônquios se ramificam em tubos cada vez mais finos.", answer: "Pulmões" },
    { clue: "Sacos minúsculos onde o oxigênio passa para o sangue; há milhões deles.", answer: "Alvéolos" }
  ];

  function shuffled(arr) {
    var a = arr.slice();
    for (var i = a.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1));
      var tmp = a[i]; a[i] = a[j]; a[j] = tmp;
    }
    return a;
  }

  // ---- tab switching ----
  var views = { atlas: document.getElementById("view-atlas"), sequence: document.getElementById("view-sequence"), function: document.getElementById("view-function") };
  var tabs = Array.prototype.slice.call(document.querySelectorAll(".tab"));
  var legendToggle = document.getElementById("legend-toggle");
  var footerProgress = document.getElementById("footer-progress");
  var currentView = "atlas";

  function showView(name) {
    currentView = name;
    Object.keys(views).forEach(function (k) { views[k].hidden = k !== name; });
    tabs.forEach(function (t) { t.classList.toggle("active", t.dataset.view === name); });
    legendToggle.style.display = name === "atlas" ? "" : "none";
    updateFooterProgress();
  }
  tabs.forEach(function (t) { t.addEventListener("click", function () { showView(t.dataset.view); }); });

  function updateFooterProgress() {
    if (currentView === "atlas") {
      footerProgress.innerHTML = '<b>' + Object.keys(atlasSolved).length + '</b> / 9 identificados';
    } else if (currentView === "sequence") {
      footerProgress.innerHTML = '<b>' + seqCorrectCount() + '</b> / 8 na ordem certa';
    } else {
      footerProgress.innerHTML = '<b>' + funcSolvedCount + '</b> / 8 respondidas';
    }
  }

  // ---- completion overlay (shared) ----
  var completeOverlay = document.getElementById("complete-overlay");
  var completeMsg = document.getElementById("complete-msg");
  function showComplete(msg) {
    completeMsg.textContent = msg;
    completeOverlay.classList.add("show");
  }
  document.getElementById("complete-reset-btn").addEventListener("click", function () {
    completeOverlay.classList.remove("show");
    resetCurrent();
  });

  // =========================================================
  // ATLAS MODE
  // =========================================================
  var legendList = document.getElementById("legend-list");
  var progressCount = document.getElementById("progress-count");
  var backdrop = document.getElementById("sheet-backdrop");
  var sheetTitle = document.getElementById("sheet-title");
  var sheetList = document.getElementById("sheet-list");
  var sheetClose = document.getElementById("sheet-close");
  var legendPanel = document.getElementById("legend-panel");
  var legendPanelClose = document.getElementById("legend-panel-close");
  var legendPanelBackdrop = document.getElementById("legend-panel-backdrop");

  var atlasSolved = {};
  var currentPinId = null;
  var lastFocused = null;

  function buildLegend() {
    legendList.innerHTML = "";
    atlasTerms.forEach(function (t) {
      var row = document.createElement("div");
      row.className = "row";
      row.innerHTML = '<span class="row-num">' + t.id + '</span>';
      var slot = document.createElement("button");
      slot.type = "button";
      slot.className = "slot";
      slot.dataset.id = t.id;
      slot.textContent = "Toque para identificar";
      slot.addEventListener("click", function () { openSheet(t.id); });
      row.appendChild(slot);
      legendList.appendChild(row);
    });
  }

  function pinEl(id) { return document.querySelector('.pin[data-id="' + id + '"]'); }
  function slotEl(id) { return document.querySelector('.slot[data-id="' + id + '"]'); }

  function openLegendPanel() { legendPanel.classList.add("open"); }
  function closeLegendPanel() { legendPanel.classList.remove("open"); }

  function openSheet(id) {
    if (atlasSolved[id]) return;
    currentPinId = id;
    lastFocused = document.activeElement;
    sheetTitle.textContent = "Estrutura nº " + id;
    var p = pinEl(id);
    if (p) p.classList.add("open");

    var remaining = atlasTerms.filter(function (t) { return !atlasSolved[t.id]; });
    sheetList.innerHTML = "";
    shuffled(remaining).forEach(function (t) {
      var opt = document.createElement("button");
      opt.type = "button";
      opt.className = "option";
      opt.textContent = t.label;
      opt.addEventListener("click", function () { chooseAtlasOption(t.id, opt); });
      sheetList.appendChild(opt);
    });

    backdrop.classList.add("show");
    document.addEventListener("keydown", onKeydown);
  }

  function closeSheet() {
    var p = currentPinId != null ? pinEl(currentPinId) : null;
    if (p) p.classList.remove("open");
    backdrop.classList.remove("show");
    document.removeEventListener("keydown", onKeydown);
    currentPinId = null;
    if (lastFocused && lastFocused.focus) lastFocused.focus();
  }

  function onKeydown(e) { if (e.key === "Escape") closeSheet(); }

  function chooseAtlasOption(chosenId, optEl) {
    if (chosenId === currentPinId) {
      markAtlasSolved(currentPinId);
      closeSheet();
    } else {
      optEl.classList.add("wrong");
      setTimeout(function () { optEl.classList.remove("wrong"); }, 340);
    }
  }

  function markAtlasSolved(id) {
    atlasSolved[id] = true;
    var t = atlasById[id];

    var p = pinEl(id);
    if (p) {
      p.classList.add("solved");
      p.classList.remove("open");
      p.querySelector(".pin-circle").setAttribute("fill", "var(--success)");
      p.querySelector(".pin-circle").setAttribute("stroke", "var(--success)");
      p.querySelector(".pin-text").setAttribute("fill", "var(--paper)");
      p.querySelector(".pin-text").textContent = "✓";
    }
    var s = slotEl(id);
    if (s) { s.classList.add("solved"); s.innerHTML = '<span class="check">✓</span>' + t.label; }

    if (currentView === "atlas") updateFooterProgress();
    else progressCount.textContent = String(Object.keys(atlasSolved).length);

    if (Object.keys(atlasSolved).length === atlasTerms.length) {
      showComplete("Você identificou corretamente todas as estruturas do sistema respiratório.");
    }
  }

  function attachPins() {
    document.querySelectorAll(".pin").forEach(function (p) {
      var id = Number(p.dataset.id);
      p.addEventListener("click", function () { openSheet(id); });
      p.addEventListener("keydown", function (e) { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); openSheet(id); } });
    });
  }

  function resetAtlas() {
    atlasSolved = {};
    closeSheet();
    closeLegendPanel();
    document.querySelectorAll(".pin").forEach(function (p) {
      p.classList.remove("solved", "open");
      p.querySelector(".pin-circle").setAttribute("fill", "var(--paper)");
      p.querySelector(".pin-circle").setAttribute("stroke", "var(--accent)");
      p.querySelector(".pin-text").setAttribute("fill", "var(--accent)");
      p.querySelector(".pin-text").textContent = p.dataset.id;
    });
    buildLegend();
  }

  sheetClose.addEventListener("click", closeSheet);
  backdrop.addEventListener("click", function (e) { if (e.target === backdrop) closeSheet(); });
  legendToggle.addEventListener("click", openLegendPanel);
  legendPanelClose.addEventListener("click", closeLegendPanel);
  legendPanelBackdrop.addEventListener("click", closeLegendPanel);

  // =========================================================
  // SEQUENCE MODE
  // =========================================================
  var seqSlotsEl = document.getElementById("seq-slots");
  var seqBankEl = document.getElementById("seq-bank");
  var seqCheckBtn = document.getElementById("seq-check");
  var seqPlaced = []; // array of labels in slot order (may contain gaps as null after clearing wrong)
  var seqChecked = false;

  function seqCorrectCount() {
    var c = 0;
    for (var i = 0; i < pathSteps.length; i++) {
      if (seqPlaced[i] === pathSteps[i] && seqSlotState[i] === "correct") c++;
    }
    return c;
  }

  var seqSlotState = []; // 'empty' | 'filled' | 'correct' | 'wrong'

  function buildSequence() {
    seqPlaced = new Array(pathSteps.length).fill(null);
    seqSlotState = new Array(pathSteps.length).fill("empty");
    seqChecked = false;
    renderSeqSlots();
    renderSeqBank();
    seqCheckBtn.disabled = true;
  }

  function renderSeqSlots() {
    seqSlotsEl.innerHTML = "";
    pathSteps.forEach(function (_, i) {
      var btn = document.createElement("button");
      btn.type = "button";
      btn.className = "seq-slot";
      var state = seqSlotState[i];
      if (state === "filled") btn.classList.add("filled");
      if (state === "correct") btn.classList.add("filled", "correct");
      if (state === "wrong") btn.classList.add("filled", "wrong");
      btn.innerHTML = '<span class="ord">' + (i + 1) + 'º</span><span>' + (seqPlaced[i] || "") + '</span>';
      btn.addEventListener("click", function () { onSeqSlotClick(i); });
      seqSlotsEl.appendChild(btn);
    });
  }

  function renderSeqBank() {
    seqBankEl.innerHTML = "";
    var used = seqPlaced.filter(function (v) { return v != null; });
    var remaining = pathSteps.filter(function (label) {
      var idx = used.indexOf(label);
      if (idx === -1) return true;
      used.splice(idx, 1);
      return false;
    });
    shuffledStable(remaining).forEach(function (label) {
      var chip = document.createElement("button");
      chip.type = "button";
      chip.className = "chip";
      chip.textContent = label;
      chip.addEventListener("click", function () { onSeqChipClick(label); });
      seqBankEl.appendChild(chip);
    });
  }

  var seqBankOrderCache = null;
  function shuffledStable(list) {
    if (!seqBankOrderCache) seqBankOrderCache = shuffled(pathSteps.slice());
    return seqBankOrderCache.filter(function (l) { return list.indexOf(l) !== -1; });
  }

  function onSeqChipClick(label) {
    var nextEmpty = seqSlotState.indexOf("empty");
    if (nextEmpty === -1) return;
    seqPlaced[nextEmpty] = label;
    seqSlotState[nextEmpty] = "filled";
    seqChecked = false;
    renderSeqSlots();
    renderSeqBank();
    seqCheckBtn.disabled = seqSlotState.indexOf("empty") !== -1;
  }

  function onSeqSlotClick(i) {
    var state = seqSlotState[i];
    if (state === "filled" || state === "wrong") {
      seqPlaced[i] = null;
      seqSlotState[i] = "empty";
      renderSeqSlots();
      renderSeqBank();
      seqCheckBtn.disabled = true;
    }
  }

  seqCheckBtn.addEventListener("click", function () {
    seqChecked = true;
    for (var i = 0; i < pathSteps.length; i++) {
      seqSlotState[i] = seqPlaced[i] === pathSteps[i] ? "correct" : "wrong";
    }
    renderSeqSlots();
    if (currentView === "sequence") updateFooterProgress();
    if (seqCorrectCount() === pathSteps.length) {
      showComplete("Você reconstruiu certinho o caminho do ar, do nariz até os alvéolos.");
    } else {
      seqCheckBtn.disabled = true;
    }
  });

  function resetSequence() {
    seqBankOrderCache = null;
    buildSequence();
    updateFooterProgress();
  }

  // =========================================================
  // FUNCTION MODE
  // =========================================================
  var funcClueEl = document.getElementById("func-clue");
  var funcOptionsEl = document.getElementById("func-options");
  var funcProgressLabel = document.getElementById("func-progress-label");
  var funcQueue = [];
  var funcSolvedCount = 0;

  function buildFunctionMode() {
    funcQueue = shuffled(functionCards.map(function (_, i) { return i; }));
    funcSolvedCount = 0;
    renderFuncCard();
  }

  function renderFuncCard() {
    if (funcQueue.length === 0) {
      showComplete("Você acertou a função de todas as estruturas do sistema respiratório.");
      return;
    }
    var idx = funcQueue[0];
    var card = functionCards[idx];
    funcProgressLabel.textContent = "Pergunta " + (funcSolvedCount + 1) + " de " + functionCards.length;
    funcClueEl.textContent = card.clue;
    funcOptionsEl.innerHTML = "";
    var opts = shuffled(functionCards.map(function (c) { return c.answer; }));
    opts.forEach(function (label) {
      var btn = document.createElement("button");
      btn.type = "button";
      btn.className = "option";
      btn.textContent = label;
      btn.addEventListener("click", function () { onFuncAnswer(label, card.answer, btn); });
      funcOptionsEl.appendChild(btn);
    });
  }

  function onFuncAnswer(chosen, correct, btnEl) {
    if (chosen === correct) {
      btnEl.classList.add("correct");
      funcSolvedCount++;
      funcQueue.shift();
      if (currentView === "function") updateFooterProgress();
      setTimeout(renderFuncCard, 450);
    } else {
      btnEl.classList.add("wrong");
      setTimeout(function () { btnEl.classList.remove("wrong"); }, 340);
    }
  }

  function resetFunctionMode() {
    buildFunctionMode();
    updateFooterProgress();
  }

  // =========================================================
  // reset dispatch + init
  // =========================================================
  function resetCurrent() {
    if (currentView === "atlas") resetAtlas();
    else if (currentView === "sequence") resetSequence();
    else resetFunctionMode();
    updateFooterProgress();
  }
  document.getElementById("reset-btn").addEventListener("click", resetCurrent);

  buildLegend();
  attachPins();
  buildSequence();
  buildFunctionMode();
  showView("atlas");
})();
</script>
